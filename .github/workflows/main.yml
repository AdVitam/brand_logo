name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']

    name: Ruby ${{ matrix.ruby }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    name: Lint, types and gem build

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop

      - name: Sorbet
        run: bundle exec srb tc

      - name: Build gem
        run: gem build brand_logo.gemspec

      - name: Assert no sorbet-runtime runtime dependency
        run: |
          if gem spec brand_logo-*.gem dependencies | grep -q sorbet; then
            echo "sorbet must not be a runtime dependency" >&2
            exit 1
          fi

  shim:
    runs-on: ubuntu-latest
    name: Without sorbet-runtime

    env:
      BUNDLE_GEMFILE: gemfiles/no_sorbet.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

  minimum:
    runs-on: ubuntu-latest
    name: Minimum dependency versions

    env:
      BUNDLE_GEMFILE: gemfiles/minimum.gemfile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec
