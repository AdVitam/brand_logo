name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build gem
        run: gem build brand_logo.gemspec

      # Credentials expire 15 minutes after this step, so build first.
      - uses: rubygems/configure-rubygems-credentials@6861877652452567c1a007a50badad3d316fc9ba

      - name: Push to RubyGems
        run: gem push brand_logo-*.gem
